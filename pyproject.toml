[project]
name = "ret-c2-281"
version = "0.1.0"
description = "Retail Demand Forecasting Report Agent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; it is
# provided by CI per repository generation — a stub package on PYTHONPATH for older repos,
# or installed from the package registry for wheel-era repos (see the dual-mode
# run-tests job in the pipeline definition). Pinning it here would make `pip install -e .`
# fail because it is not resolvable from the default index.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-cov==5.0.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20240311",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The framework wheel ships no type information, so every symbol imported from
# it resolves to Any. Without these settings strict mode rejects this template's
# own correct code for the wheel's missing annotations.
disallow_subclassing_any = false
# Published sample code is excluded rather than annotated: it is illustrative
# material for the next template author and is not edited by this repo.
exclude = "src/examples/"

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The state base class resolves to Any through the untyped wheel, so every field
# of a subclass fails the valid-type check for that one reason. The individual
# field errors all share the single cause and are not worth chasing separately.
module = ["src.schemas.state"]
disable_error_code = ["valid-type"]
